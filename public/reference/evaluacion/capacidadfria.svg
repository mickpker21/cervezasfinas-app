<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#e6f7ff" />
      <stop offset="1" stop-color="#dff3e6" />
    </linearGradient>
    <style>
      .t { font: 28px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill: #0f172a; }
      .s { font: 38px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill: #064e3b; font-weight: 700; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" rx="8" />
  <g transform="translate(40,70)">
    <text class="s">Referencia — Capacidad Fría</text>
    <text class="t" y="60">Opciones comunes: 144, 192, 320, 376, 500, 900, 1500</text>
  </g>
  <g transform="translate(40,170)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#fff" stroke="#c7f0e0" />
    <text class="t" x="12" y="40">144</text>
    <text class="t" x="12" y="80">192</text>
    <text class="t" x="100" y="40">320</text>
    <text class="t" x="100" y="80">376</text>
    <text class="t" x="200" y="40">500</text>
    <text class="t" x="300" y="40">900</text>
    <text class="t" x="400" y="40">1500</text>
  </g>
</svg>
